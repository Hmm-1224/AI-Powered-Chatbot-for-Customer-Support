<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chatbot</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #chatbox {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }
        #message { width: 100%; }
        .message {
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 5px;
            background-color: #e6f7ff;
        }
        .user {
            font-weight: bold;
            color: #2c3e50;
            background-color: #d1ecf1;
        }
        .bot {
            font-style: italic;
            color: #3498db;
            background-color: #f0f8ff;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<h1>Customer Support Chatbot</h1>
<div id="chatbox"></div>
<input type="text" id="message" placeholder="Type your message..." />
<button id="send">Send</button>

<script>
    $(document).ready(function() {
        $('#send').click(function() {
            const message = $('#message').val().trim();  // Get the trimmed message
            if (message) {
                // Append the user's message to the chatbox
                $('#chatbox').append(`<div class="message user">User: ${message}</div>`);
                $('#message').val('');  // Clear the input field

                // Send the user's message to the backend as JSON
                $.ajax({
                    url: '/ask',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: message }),
                    success: function(data) {
                        // Check if the response contains the expected data
                        if (data && data.response) {
                            $('#chatbox').append(`<div class="message bot">Bot: ${data.response}</div>`);
                            $('#chatbox').scrollTop($('#chatbox')[0].scrollHeight);  // Scroll to the bottom
                        } else {
                            $('#chatbox').append(`<div class="message bot">Bot: Sorry, I didn't get that. Please try again.</div>`);
                        }
                    },
                    error: function(error) {
                        console.error('Error:', error);
                        $('#chatbox').append(`<div class="message bot">Bot: An error occurred, please try again later.</div>`);
                    }
                });
            }
        });

        // Trigger click on Enter key press
        $('#message').keypress(function(e) {
            if (e.which == 13) {
                $('#send').click();
            }
        });
    });
</script>

</body>
</html>
